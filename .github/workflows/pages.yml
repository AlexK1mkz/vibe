# Лёгкий деплой GitHub Pages: публикуем только то, что нужно сайтам.
# Исходники (raw-фото, HEIC, архивы, файлы > 5 МБ) остаются в репо, но не уходят на Pages.
# Включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy Pages (light)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать папку для публикации
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude '*.zip' --exclude '*.heic' --exclude '*.HEIC' \
            --exclude 'node_modules' \
            --max-size=5m
          touch _site/.nojekyll
          echo "Размер публикации:"; du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
