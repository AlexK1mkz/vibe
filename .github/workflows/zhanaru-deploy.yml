# ZhanaRu: автовыкладка на Hoster.kz (Plesk).
# Любое изменение в Zhanaru/web на main → тесты → сборка под zhanaru.vip →
# заливка готовых файлов в httpdocs по FTPS (только изменённые файлы).
# Если тесты или сборка упали — сайт не трогается.
#
# Нужны два секрета репозитория (Settings → Secrets and variables → Actions):
#   ZHANARU_FTP_USERNAME — отдельная FTP-учётка Plesk с домашней папкой /httpdocs (zhanaru_deploy)
#   ZHANARU_FTP_PASSWORD — её пароль
# Настройки заявок (zhanaru-config.php) лежат на хостинге выше httpdocs — выкладка их не видит и не трогает.
name: ZhanaRu → Hoster.kz

on:
  push:
    branches: [main]
    paths:
      - 'Zhanaru/web/**'
      - '.github/workflows/zhanaru-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhanaru-deploy
  cancel-in-progress: false

env:
  SITE_URL: https://zhanaru.vip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Zhanaru/web/package-lock.json

      - name: Зависимости
        working-directory: Zhanaru/web
        run: npm ci --no-audit --no-fund

      - name: Тесты
        working-directory: Zhanaru/web
        run: npm test

      - name: Сборка
        working-directory: Zhanaru/web
        run: npm run build

      - name: Проверка сборки
        working-directory: Zhanaru/web
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/lead.php
          rm -rf dist/api/private/config.php dist/api/private/rate

      - name: Есть ли доступ к FTP
        id: ftp
        env:
          FTP_USER: ${{ secrets.ZHANARU_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.ZHANARU_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::warning::Сайт собран и проверен, но не выложен: не заданы секреты ZHANARU_FTP_USERNAME / ZHANARU_FTP_PASSWORD (см. шапку файла)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Выкладка в httpdocs
        if: steps.ftp.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: pkz21.hoster.kz
          protocol: ftps
          username: ${{ secrets.ZHANARU_FTP_USERNAME }}
          password: ${{ secrets.ZHANARU_FTP_PASSWORD }}
          local-dir: Zhanaru/web/dist/
          # FTP-учётка zhanaru_deploy видит только httpdocs — это её корень
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            api/private/rate/**
            api/private/config.php

      - name: Проверка живого сайта
        if: steps.ftp.outputs.ok == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' https://zhanaru.vip/)
          echo "HTTP $code"
          test "$code" = 200
          grep -q "ZhanaRu" /tmp/home.html
