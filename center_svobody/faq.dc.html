<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Вопросы и ответы — Центр Свободы, Астана</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html,body{margin:0;background:#F5F2EC;color:#1E2422;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#1F3B36;text-decoration:none}a:hover{color:#4E8C7E}h1,h2,h3{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;color:#1F3B36;text-wrap:pretty}p{margin:0;text-wrap:pretty}</style>
</helmet>
<dc-import name="Header" hint-size="100%,72px"></dc-import>
<section data-screen-label="FAQ" style="max-width:1240px;margin:0 auto;padding:40px 20px 88px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px">
  <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
    <nav style="font-size:13px;color:#5C6663;display:flex;gap:8px"><a href="./" style="color:#5C6663">Главная</a><span>/</span><span style="color:#1F3B36">FAQ</span></nav>
    <h1 style="font-size:clamp(38px,4.6vw,64px);line-height:1.02">Вопросы и ответы</h1>
    <p style="font-size:16px;color:#5C6663;line-height:1.55">Общие вопросы о центре. Вопросы по конкретной услуге — на её странице.</p>
    <a href="{{ wa }}" style="height:52px;padding:0 24px;border-radius:999px;background:#4E8C7E;color:#fff;display:inline-flex;align-items:center;font-size:14.5px;font-weight:600" style-hover="background:#3F7A6D;color:#fff">Спросить в WhatsApp</a>
  </div>
  <div style="grid-column:span 2;display:flex;flex-direction:column">
    <sc-for list="{{ faq }}" as="f" hint-placeholder-count="8">
      <div style="border-top:1px solid rgba(31,59,54,.12)">
        <button onClick="{{ f.toggle }}" style="width:100%;text-align:left;background:transparent;border:0;padding:22px 0;display:flex;justify-content:space-between;gap:20px;align-items:center;cursor:pointer;font-size:18px;font-weight:600;color:#1F3B36;font-family:inherit"><span>{{ f.q }}</span><span style="font-size:24px;color:#4E8C7E;font-weight:400;flex-shrink:0">{{ f.sign }}</span></button>
        <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}"><p style="padding:0 40px 22px 0;font-size:15.5px;line-height:1.65;color:#5C6663">{{ f.a }}</p></sc-if>
      </div>
    </sc-for>
    <div style="border-top:1px solid rgba(31,59,54,.12)"></div>
  </div>
</section>
<dc-import name="Footer" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { d: null, open: 0 };
  componentDidMount() { import('./data.js').then(d => this.setState({ d })); }
  renderVals() {
    const { d, open } = this.state; if (!d) return {};
    const extra = [...d.FAQ, ...d.bySlug('checkup-brt').faq.slice(0, 2), ...d.bySlug('zerkala-kozyreva').faq.slice(0, 2)];
    return { wa: d.SITE.wa('консультацию'), faq: extra.map((f, i) => ({ ...f, open: open === i, sign: open === i ? '−' : '+', toggle: () => this.setState({ open: open === i ? -1 : i }) })) };
  }
}
</script>
</body>
</html>
