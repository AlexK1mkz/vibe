<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>input{font-family:inherit}input:focus-visible,button:focus-visible{outline:2px solid #C9A66B;outline-offset:2px}</style>
</helmet>
<div style="background:#1F3B36;color:#fff;border-radius:32px;padding:40px;font-family:'Manrope',sans-serif;position:relative;overflow:hidden">
  <span style="position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;border:1px solid rgba(201,166,107,.25);pointer-events:none"></span>
  <span style="position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(201,166,107,.35);pointer-events:none"></span>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;position:relative">
    <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#C9A66B;font-weight:600">Подберём программу</span>
    <span style="font-size:12.5px;color:#A9B0AC">{{ stepLabel }}</span>
  </div>
  <div style="height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-bottom:28px;overflow:hidden"><div style="height:100%;background:#C9A66B;width: {{ progress }};transition:width .4s"></div></div>
  <sc-if value="{{ isOptions }}" hint-placeholder-val="{{ true }}">
    <h3 style="margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.1">{{ question }}</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="6">
        <button onClick="{{ o.pick }}" style="text-align:left;min-height:56px;padding:14px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;font-size:15px;font-weight:500;cursor:pointer" style-hover="background:rgba(201,166,107,.18);border-color:#C9A66B">{{ o.label }}</button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
    <h3 style="margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.1">Куда прислать подборку?</h3>
    <p style="margin:0 0 20px;font-size:14.5px;color:#A9B0AC">Напишем в WhatsApp, что подойдёт и сколько стоит.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
      <input value="{{ name }}" onChange="{{ setName }}" placeholder="Имя" style="height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:0 16px;font-size:15px">
      <input value="{{ phone }}" onChange="{{ setPhone }}" placeholder="+7 ___ ___ __ __" inputMode="tel" style="height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:0 16px;font-size:15px">
    </div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap">
      <button onClick="{{ finish }}" style="height:54px;padding:0 28px;border:0;border-radius:999px;background:#C9A66B;color:#16211F;font-size:15px;font-weight:700;cursor:pointer" style-hover="background:#D9B97E">Показать результат</button>
      <button onClick="{{ back }}" style="height:54px;padding:0 18px;border:0;background:transparent;color:#A9B0AC;font-size:14px;cursor:pointer">← Назад</button>
    </div>
  </sc-if>
  <sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
    <span style="font-size:13px;color:#A9B0AC">Вам подойдёт</span>
    <h3 style="margin:6px 0 10px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px;line-height:1.05">{{ result.name }}</h3>
    <p style="margin:0 0 6px;font-size:15px;line-height:1.55;color:#D8D5CD;max-width:560px">{{ result.short }}. {{ result.why }}</p>
    <p style="margin:0 0 22px;font-size:22px;font-weight:600;color:#C9A66B">{{ result.price }}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a href="{{ result.wa }}" style="height:54px;padding:0 28px;border-radius:999px;background:#C9A66B;color:#16211F;display:inline-flex;align-items:center;font-size:15px;font-weight:700" style-hover="background:#D9B97E;color:#16211F">Записаться в WhatsApp</a>
      <a href="{{ result.href }}" style="height:54px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fff;display:inline-flex;align-items:center;font-size:15px;font-weight:600" style-hover="border-color:#C9A66B;color:#fff">Подробнее об услуге</a>
      <button onClick="{{ restart }}" style="height:54px;padding:0 14px;border:0;background:transparent;color:#A9B0AC;font-size:14px;cursor:pointer">Пройти заново</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:420}}">
class Component extends DCLogic {
  state = { step: 0, a: [], name: '', phone: '' };
  Q = [
    { q: 'Что беспокоит больше всего?', o: ['Сон', 'Стресс и тревога', 'Усталость', 'Тело и зажимы', 'Страхи', 'Хочу проверить организм'] },
    { q: 'Как давно это с вами?', o: ['Пару недель', 'Несколько месяцев', 'Больше года', 'Сколько себя помню'] },
    { q: 'Когда удобно прийти?', o: ['Днём', 'Вечером', 'Ночной сеанс'] },
  ];
  MAP = { 'Сон': ['zerkala-kozyreva', 'Сон — главная база восстановления, а зеркала дают опыт настоящей тишины.'], 'Стресс и тревога': ['psiholog', 'Разберём, что держит в напряжении, и подключим практики центра.'], 'Усталость': ['checkup-brt', 'Сначала увидим картину целиком, потом подберём курс.'], 'Тело и зажимы': ['telesnaya-terapiya', 'Напряжение живёт в теле — с ним и работаем.'], 'Страхи': ['vr-terapiya', 'Короткие сессии в VR под сопровождением специалиста.'], 'Хочу проверить организм': ['checkup-brt', 'Один визит вместо недель по кабинетам.'] };
  componentDidMount() { import('./data.js').then(d => { this.d = d; this.forceUpdate(); }); }
  renderVals() {
    const { step, a, name, phone } = this.state;
    const d = this.d;
    const total = 4;
    let result = null;
    if (step === 4 && d) {
      const [slug, why] = this.MAP[a[0]] || this.MAP['Усталость'];
      const s = d.bySlug(slug);
      const night = a[2] === 'Ночной сеанс' && s.priceNight;
      result = { name: night ? 'Ночной сеанс в зеркалах Козырева' : s.name, short: s.short, why, price: d.fmt(night ? s.priceNight : s.price), href: d.svcHref(slug),
        wa: 'https://wa.me/77052281372?text=' + encodeURIComponent('Здравствуйте! Прошёл(ла) квиз на сайте. Запрос: ' + a[0] + ', ' + a[1] + ', ' + a[2] + '. Хочу записаться на ' + s.name + (name ? '. Меня зовут ' + name : '')) };
    }
    const cur = this.Q[step];
    return {
      stepLabel: step < 4 ? 'Шаг ' + (step + 1) + ' из ' + total : 'Готово', progress: Math.min(step + 1, 4) / total * 100 + '%',
      isOptions: step < 3, isContact: step === 3, isResult: step === 4,
      question: cur ? cur.q : '', options: cur ? cur.o.map(label => ({ label, pick: () => this.setState(s => ({ step: s.step + 1, a: [...s.a.slice(0, step), label] })) })) : [],
      name, phone, setName: e => this.setState({ name: e.target.value }), setPhone: e => this.setState({ phone: e.target.value }),
      finish: () => this.setState({ step: 4 }), back: () => this.setState({ step: 2 }), restart: () => this.setState({ step: 0, a: [] }), result,
    };
  }
}
</script>
</body>
</html>
