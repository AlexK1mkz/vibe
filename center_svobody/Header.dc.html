<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#F5F2EC;color:#1E2422;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    a{color:#1F3B36;text-decoration:none}a:hover{color:#4E8C7E}
    button{font-family:inherit}
    @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
  </style>
</helmet>
<div style="position:sticky;top:0;z-index:50;background:rgba(245,242,236,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(31,59,54,.1)">
  <div style="max-width:1240px;margin:0 auto;padding:0 20px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <img src="logo.png" alt="Центр Свободы" style="width:44px;height:44px;flex-shrink:0;display:block">
      <span style="display:flex;flex-direction:column;line-height:1.05"><span style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;color:#1F3B36">Центр Свободы</span><span style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5C6663">восстановление · Астана</span></span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:20px;font-size:14px;font-weight:500;flex-wrap:nowrap;white-space:nowrap">
        <span style="position:relative" onMouseEnter="{{ openSub }}" onMouseLeave="{{ closeSub }}">
          <a href="uslugi.dc.html" style="display:inline-flex;align-items:center;gap:5px">Услуги <span style="font-size:10px">▾</span></a>
          <sc-if value="{{ sub }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:100%;left:-16px;padding-top:14px">
              <div style="background:#fff;border-radius:18px;box-shadow:0 18px 50px -20px rgba(31,59,54,.35);padding:10px;min-width:280px;display:flex;flex-direction:column">
                <sc-for list="{{ services }}" as="s" hint-placeholder-count="8">
                  <a href="{{ s.href }}" style="padding:10px 14px;border-radius:12px;display:flex;justify-content:space-between;gap:14px;font-size:14px" style-hover="background:#F5F2EC"><span>{{ s.name }}</span><span style="color:#5C6663;white-space:nowrap;font-weight:400">{{ s.price }}</span></a>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </span>
        <a href="usluga.dc.html?s=checkup-brt">Чекап</a>
        <a href="usluga.dc.html?s=zerkala-kozyreva">Зеркала Козырева</a>
        <a href="programmy.dc.html">Программы</a>
        <a href="komanda.dc.html">Команда</a>
        <a href="otzyvy.dc.html">Отзывы</a>
        <a href="blog.dc.html">Блог</a>
        <a href="kontakty.dc.html">Контакты</a>
      </nav>
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:1;min-width:0">
        <span style="display:inline-flex;border:1px solid rgba(31,59,54,.18);border-radius:999px;padding:3px;font-size:12px;font-weight:600">
          <span style="padding:4px 10px;border-radius:999px;background:#1F3B36;color:#fff">RU</span><span style="padding:4px 10px;color:#5C6663">KZ</span>
        </span>
        <a href="{{ tel }}" style="font-weight:600;font-size:14.5px;white-space:nowrap">{{ phone }}</a>
        <a href="{{ wa }}" style="background:#4E8C7E;color:#fff;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:600;white-space:nowrap" style-hover="background:#3F7A6D;color:#fff">Записаться</a>
      </div>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Меню" style="width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;gap:0;cursor:pointer">
        <span style="display:block;width:22px;height:2px;background:#1F3B36;margin:3px 0"></span><span style="display:block;width:22px;height:2px;background:#1F3B36;margin:3px 0"></span><span style="display:block;width:14px;height:2px;background:#1F3B36;margin:3px 0;justify-self:start"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:72px 0 0 0;background:#F5F2EC;padding:20px 20px 120px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:500">
      <a href="uslugi.dc.html" style="padding:14px 0;border-bottom:1px solid rgba(31,59,54,.1)">Все услуги</a>
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="8">
        <a href="{{ s.href }}" style="padding:10px 0 10px 16px;display:flex;justify-content:space-between;font-size:15px"><span>{{ s.name }}</span><span style="color:#5C6663">{{ s.price }}</span></a>
      </sc-for>
      <a href="programmy.dc.html" style="padding:14px 0;border-top:1px solid rgba(31,59,54,.1)">Программы</a>
      <a href="komanda.dc.html" style="padding:14px 0;border-top:1px solid rgba(31,59,54,.1)">Команда</a>
      <a href="otzyvy.dc.html" style="padding:14px 0;border-top:1px solid rgba(31,59,54,.1)">Отзывы</a>
      <a href="blog.dc.html" style="padding:14px 0;border-top:1px solid rgba(31,59,54,.1)">Блог</a>
      <a href="o-centre.dc.html" style="padding:14px 0;border-top:1px solid rgba(31,59,54,.1)">О центре</a>
      <a href="kontakty.dc.html" style="padding:14px 0;border-top:1px solid rgba(31,59,54,.1)">Контакты</a>
      <div style="display:flex;gap:10px;align-items:center;padding-top:16px;font-size:14px"><span style="padding:6px 12px;border-radius:999px;background:#1F3B36;color:#fff">RU</span><span style="padding:6px 12px;color:#5C6663">KZ</span><a href="{{ tel }}" style="margin-left:auto;font-weight:600">{{ phone }}</a></div>
    </div>
  </sc-if>
</div>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
  <a href="{{ wa }}" aria-label="WhatsApp" style="position:fixed;right:28px;bottom:28px;z-index:60;width:60px;height:60px;border-radius:50%;background:#4E8C7E;display:grid;place-items:center;box-shadow:0 14px 36px -10px rgba(31,59,54,.5)" style-hover="background:#3F7A6D">
    <span style="position:absolute;inset:0;border-radius:50%;background:#4E8C7E;animation:pulse 2.4s ease-out infinite;z-index:-1"></span>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"></path></svg>
  </a>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid rgba(31,59,54,.1);display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))">
    <a href="{{ tel }}" style="height:48px;border-radius:999px;border:1px solid rgba(31,59,54,.2);display:grid;place-items:center;font-size:14px;font-weight:600">Позвонить</a>
    <a href="{{ wa }}" style="height:48px;border-radius:999px;background:#1F3B36;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600">WhatsApp</a>
    <a href="#zapis" style="height:48px;border-radius:999px;background:#4E8C7E;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600">Записаться</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;service&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Чекап БРТ&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;WhatsApp&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, menuOpen: false, sub: false, services: [], site: null };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._r);
    import('./data.js').then(d => this.setState({ site: d.SITE, services: d.SERVICES.map(s => ({ name: s.name, href: d.svcHref(s.slug), price: d.fmt(s.price) })) }));
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const { w, menuOpen, sub, services, site } = this.state;
    const mobile = w < 1280;
    const svc = this.props.service || 'Чекап БРТ';
    return {
      desktop: !mobile, mobile, menuOpen: mobile && menuOpen, sub, services,
      phone: site ? site.phone : '+7 705 228 13 72', tel: 'tel:+77052281372',
      wa: site ? site.wa(svc) : 'https://wa.me/77052281372',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      openSub: () => this.setState({ sub: true }), closeSub: () => this.setState({ sub: false }),
    };
  }
}
</script>
</body>
</html>
