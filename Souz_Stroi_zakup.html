  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght:14px;background:currentColor;border-radius:2px;animation:ss-in .45s infinite alternate\"><\u002Fi><\u002Fspan> Слушаю… говорите<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ ai.fileCount }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:var(--color-success);font-weight:600\">✓ прикреплено: {{ ai.fileCount }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"position:absolute;right:12px;bottom:12px;display:flex;gap:8px\">\n              <button sc-camel-on-click=\"{{ aiVoice }}\" class=\"btn btn-icon\" style=\"background:{{ aiMicBg }};color:{{ aiMicFg }};width:40px;height:40px\" aria-label=\"Голосовой ввод\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z\"><\u002Fpath><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"><\u002Fpath><line x1=\"12\" x2=\"12\" y1=\"19\" y2=\"22\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ aiAttach }}\" class=\"btn btn-icon\" style=\"background:var(--color-accent-light);color:var(--color-accent);width:40px;height:40px\" aria-label=\"Прикрепить\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ aiGenerate }}\" class=\"btn\" style=\"background:#fff;color:var(--color-accent);font-weight:700\" disabled=\"{{ ai.busy }}\">{{ aiBtn }}<\u002Fbutton>\n            <span style=\"font-size:13px;opacity:.85\">{{ aiHint }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ qsIsTpl }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px\">\n            <sc-for list=\"{{ templates }}\" as=\"tp\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ tp.use }}\" style=\"background:#fff;color:var(--color-text);border-radius:var(--radius-md);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px\" style-hover=\"box-shadow:var(--shadow-md)\">\n                <div style=\"font-weight:700;font-size:14px;line-height:1.25\">{{ tp.title }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--color-muted)\">{{ tp.sphere }} · использован {{ tp.used }} раз<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--color-accent);font-weight:600\">Создать из шаблона →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ qsIsDraft }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ drafts }}\" as=\"dr\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ dr.use }}\" style=\"background:#fff;color:var(--color-text);border-radius:var(--radius-md);padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap\" style-hover=\"box-shadow:var(--shadow-md)\">\n                <div><div style=\"font-weight:700;font-size:14px\">{{ dr.title }}<\u002Fdiv><div style=\"font-size:12px;color:var(--color-muted)\">{{ dr.sphere }} · изменён {{ dr.date }} · шаг {{ dr.step }} из 5<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:12px;color:var(--color-accent);font-weight:600\">Продолжить →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 4;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Как это работает<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;font-size:13px\"><b style=\"color:var(--color-accent);min-width:18px\">1<\u002Fb><span>Опишите словами или голосом: что, сколько, куда и к какому сроку. Можно приложить спецификацию.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;font-size:13px\"><b style=\"color:var(--color-accent);min-width:18px\">2<\u002Fb><span>ИИ подставит название, описание, сферу, регион, лоты и сроки в форму ниже.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;font-size:13px\"><b style=\"color:var(--color-accent);min-width:18px\">3<\u002Fb><span>Проверьте поля и опубликуйте — уведомление получат поставщики нужных сфер.<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:auto;font-size:12px;color:var(--color-muted)\">Черновик сохраняется автоматически. Любую закупку можно сохранить как шаблон.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"font-size:20px;margin:0 0 12px\">Основное<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px\">\n      <div class=\"field\" style=\"grid-column:span 2\"><label>Тип и вид закупки<\u002Flabel>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"wtype\" checked=\"{{ wType1 }}\" sc-camel-on-change=\"{{ setWType1 }}\">Тендер<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"wtype\" checked=\"{{ wType2 }}\" sc-camel-on-change=\"{{ setWType2 }}\">Торги<\u002Flabel><\u002Fdiv>\n          <div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"wkind\" checked=\"{{ wKind1 }}\" sc-camel-on-change=\"{{ setWKind1 }}\">Открытый<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"wkind\" checked=\"{{ wKind2 }}\" sc-camel-on-change=\"{{ setWKind2 }}\">Закрытый по приглашению<\u002Flabel><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\" style=\"grid-column:span 2\"><label>Название закупки *<\u002Flabel><input class=\"input\" placeholder=\"Например: Поставка кирпича керамического М150, ЖК Sezim Qala\" value=\"{{ wiz.title }}\" sc-camel-on-change=\"{{ onWiz.title }}\"><div style=\"font-size:12px;color:var(--color-danger);min-height:16px\">{{ wizErr.title }}<\u002Fdiv><\u002Fdiv>\n      <div class=\"field\" style=\"grid-column:span 2\"><label>Описание<\u002Flabel><textarea class=\"input\" placeholder=\"Что закупаете, требования к качеству, условия поставки\" value=\"{{ wiz.desc }}\" sc-camel-on-change=\"{{ onWiz.desc }}\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"field\"><label>Проект<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ wiz.project }}\" sc-camel-on-change=\"{{ onWiz.project }}\"><option>ЖК Sezim Qala<\u002Foption><option>ЖК Nura Esil<\u002Foption><option>4 YOU Comfort<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <div class=\"field\"><label>Регион поставки *<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ wiz.region }}\" sc-camel-on-change=\"{{ onWiz.region }}\"><sc-for list=\"{{ regionsOnly }}\" as=\"r\" hint-placeholder-count=\"3\"><option value=\"{{ r }}\">{{ r }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n      <div class=\"field\"><label>Начало приёма КП *<\u002Flabel><input class=\"input\" type=\"datetime-local\" value=\"{{ wiz.start }}\" sc-camel-on-change=\"{{ onWiz.start }}\"><\u002Fdiv>\n      <div class=\"field\"><label>Окончание приёма КП *<\u002Flabel><input class=\"input\" type=\"datetime-local\" value=\"{{ wiz.end }}\" sc-camel-on-change=\"{{ onWiz.end }}\"><div style=\"font-size:12px;color:var(--color-danger);min-height:16px\">{{ wizErr.end }}<\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Подведение итогов *<\u002Flabel><input class=\"input\" type=\"datetime-local\" value=\"{{ wiz.results }}\" sc-camel-on-change=\"{{ onWiz.results }}\"><\u002Fdiv>\n      <div class=\"field\"><label>Выбор победителя<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ wiz.winner }}\" sc-camel-on-change=\"{{ onWiz.winner }}\"><option>ручной<\u002Foption><option>автоматический по цене<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <label style=\"grid-column:span 2;display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ wiz.free }}\" sc-camel-on-change=\"{{ onWizFree }}\" style=\"margin-top:3px\"><span><b>Бесплатное участие<\u002Fb><br><span style=\"font-size:13px;color:var(--color-neutral-700)\">Поставщики без тарифа смогут подать КП. Больше откликов, но без фильтра по тарифу.<\u002Fspan><\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ wiz2 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font-size:14px;color:var(--color-neutral-700);margin-bottom:12px\">Выберите категории — уведомление получат компании с этими сферами деятельности. Выбрано: <b>{{ wizSphereCount }}<\u002Fb><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\">\n      <sc-for list=\"{{ sphereTree }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px\">\n          <div style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;margin-bottom:8px\">{{ g.title }}<\u002Fdiv>\n          <sc-for list=\"{{ g.items }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <label style=\"display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;cursor:pointer;border-top:1px solid var(--color-neutral-200)\"><input type=\"checkbox\" checked=\"{{ c.on }}\" sc-camel-on-change=\"{{ c.toggle }}\">{{ c.label }}<\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ wiz3 }}\" hint-placeholder-val=\"{{ false }}\">\n    <sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>№<\u002Fsc-raw-th><sc-raw-th style=\"width:36%\">Наименование лота *<\u002Fsc-raw-th><sc-raw-th>Ед.<\u002Fsc-raw-th><sc-raw-th>Кол-во *<\u002Fsc-raw-th><sc-raw-th>НМЦ за ед.<\u002Fsc-raw-th><sc-raw-th>Срок<\u002Fsc-raw-th><sc-raw-th>Сумма<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ wizLotRows }}\" as=\"l\" hint-placeholder-count=\"2\">\n          <sc-raw-tr>\n            <sc-raw-td>{{ l.i }}<\u002Fsc-raw-td>\n            <sc-raw-td><input class=\"input\" value=\"{{ l.n }}\" sc-camel-on-change=\"{{ l.setN }}\" placeholder=\"Наименование, марка, ГОСТ\"><\u002Fsc-raw-td>\n            <sc-raw-td><sc-raw-select class=\"input\" value=\"{{ l.unit }}\" sc-camel-on-change=\"{{ l.setUnit }}\"><option>шт<\u002Foption><option>т<\u002Foption><option>м³<\u002Foption><option>м²<\u002Foption><option>м<\u002Foption><option>компл<\u002Foption><option>мес<\u002Foption><option>мешок<\u002Foption><\u002Fsc-raw-select><\u002Fsc-raw-td>\n            <sc-raw-td><input class=\"input\" type=\"number\" value=\"{{ l.qty }}\" sc-camel-on-change=\"{{ l.setQty }}\" style=\"width:90px\"><\u002Fsc-raw-td>\n            <sc-raw-td><input class=\"input\" type=\"number\" value=\"{{ l.price }}\" sc-camel-on-change=\"{{ l.setPrice }}\" style=\"width:130px\"><\u002Fsc-raw-td>\n            <sc-raw-td><input class=\"input\" type=\"date\" value=\"{{ l.term }}\" sc-camel-on-change=\"{{ l.setTerm }}\"><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-weight:600;white-space:nowrap\">{{ l.totalFmt }}<\u002Fsc-raw-td>\n            <sc-raw-td><button sc-camel-on-click=\"{{ l.remove }}\" class=\"btn btn-ghost\" aria-label=\"Удалить\">✕<\u002Fbutton><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px\">\n      <div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ addLot }}\" class=\"btn btn-secondary\">+ Добавить лот<\u002Fbutton><button sc-camel-on-click=\"{{ toastImport }}\" class=\"btn btn-secondary\">Импорт из Excel<\u002Fbutton><\u002Fdiv>\n      <div style=\"font-size:14px\">НМЦ закупки: <b style=\"font-size:18px\">{{ wizTotalFmt }}<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:var(--color-danger);min-height:16px;margin-top:6px\">{{ wizErr.lots }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ wiz4 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px\">\n      <div sc-camel-on-click=\"{{ addFile }}\" style=\"background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:40px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:2px dashed var(--color-accent-300);border-radius:var(--radius-md);margin:12px\" style-hover=\"border-color:var(--color-accent)\">\n        <div style=\"font-weight:600\">Перетащите файлы или нажмите, чтобы выбрать<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--color-neutral-700)\">Техническая спецификация, ведомость объёмов, проект договора. PDF, DOCX, XLSX до 50 МБ<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px\">\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Прикреплено · {{ wizFileCount }}<\u002Fdiv>\n        <sc-for list=\"{{ wiz.files }}\" as=\"f\" hint-placeholder-count=\"1\"><div style=\"font-size:14px;padding:8px 0;border-top:1px solid var(--color-neutral-200)\">{{ f }}<\u002Fdiv><\u002Fsc-for>\n        <label style=\"display:flex;gap:8px;align-items:center;font-size:13px;margin-top:16px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ wiz.reqSpec }}\" sc-camel-on-change=\"{{ onWizReqSpec }}\">Требовать от поставщика техническую спецификацию и подтверждающие документы<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ wiz5 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px\">\n      <div style=\"grid-column:span 7;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\">Проверьте перед публикацией<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px\">\n          <span style=\"color:var(--color-neutral-600)\">Название<\u002Fspan><b>{{ wizTitleOrDash }}<\u002Fb>\n          <span style=\"color:var(--color-neutral-600)\">Тип<\u002Fspan><span>{{ wiz.kind }} {{ wizTypeLower }} · победитель: {{ wiz.winner }}<\u002Fspan>\n          <span style=\"color:var(--color-neutral-600)\">Регион · проект<\u002Fspan><span>{{ wiz.region }} · {{ wiz.project }}<\u002Fspan>\n          <span style=\"color:var(--color-neutral-600)\">Приём КП<\u002Fspan><span>{{ wizStartFmt }} — {{ wizEndFmt }}<\u002Fspan>\n          <span style=\"color:var(--color-neutral-600)\">Лоты<\u002Fspan><span>{{ wizLotCount }} на {{ wizTotalFmt }}<\u002Fspan>\n          <span style=\"color:var(--color-neutral-600)\">Сферы рассылки<\u002Fspan><span>{{ wizSphereList }}<\u002Fspan>\n          <span style=\"color:var(--color-neutral-600)\">Файлы<\u002Fspan><span>{{ wizFileCount }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 5;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\">Рассылка<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:40px;line-height:1\">{{ wizReach }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:4px\">компаний получат уведомление в кабинет, на e-mail и в Telegram<\u002Fdiv>\n        <sc-if value=\"{{ wKind2 }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"field\" style=\"margin-top:14px\"><label>БИН приглашённых компаний (закрытый тендер)<\u002Flabel><textarea class=\"input\" placeholder=\"По одному БИН в строке\" value=\"{{ wiz.invites }}\" sc-camel-on-change=\"{{ onWiz.invites }}\"><\u002Ftextarea><\u002Fdiv><\u002Fsc-if>\n        <label style=\"display:flex;gap:8px;align-items:center;font-size:13px;margin-top:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ wiz.openResults }}\" sc-camel-on-change=\"{{ onWizOpenResults }}\">Показывать итоги участникам после завершения<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;justify-content:space-between;margin-top:24px;gap:8px;flex-wrap:wrap\">\n    <button sc-camel-on-click=\"{{ wizBack }}\" class=\"btn btn-secondary\" disabled=\"{{ wiz1 }}\">← Назад<\u002Fbutton>\n    <div style=\"display:flex;gap:8px\">\n      <button sc-camel-on-click=\"{{ wizDraft }}\" class=\"btn btn-secondary\">Сохранить черновик<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ wizTemplate }}\" class=\"btn btn-secondary\">Сохранить как шаблон<\u002Fbutton>\n      <sc-if value=\"{{ wizNotLast }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ wizNext }}\" class=\"btn btn-primary\">Далее →<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ wiz5 }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ wizPublish }}\" class=\"btn btn-primary\">{{ wizPublishLabel }}<\u002Fbutton><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ═══ ЭДО: ПАНЕЛЬ КОНТРОЛЯ ═══ -->\n<sc-if value=\"{{ isDocsPanel }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"ЭДО · Панель контроля\" style=\"animation:ss-in .25s ease\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n    <h1 style=\"font-size:34px;margin:0\">Панель контроля документов<\u002Fh1>\n    <button sc-camel-on-click=\"{{ goDocsNew }}\" class=\"btn btn-primary\">Создать документ<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px\">\n    <sc-for list=\"{{ docStats }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <div sc-camel-on-click=\"{{ s.open }}\" style=\"grid-column:span 2;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px;cursor:pointer\" style-hover=\"background:var(--color-neutral-100)\">\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:40px;line-height:1;color:{{ s.color }}\">{{ s.n }}<\u002Fdiv>\n        <div style=\"font-size:13px;margin-top:8px\">{{ s.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"grid-column:span 7;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Требуют действия · просрочены<\u002Fdiv>\n      <sc-for list=\"{{ overdue }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ d.open }}\" class=\"ss-row\" style=\"display:flex;fle ts }}<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-for>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table><\u002Fdiv>\n  <sc-if value=\"{{ dEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:40px;text-align:center;color:var(--color-neutral-700)\">Документов с такими параметрами нет.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ═══ ЭДО: НОВЫЙ ДОКУМЕНТ ═══ -->\n<sc-if value=\"{{ isDocNew }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"ЭДО · Создать документ\" style=\"animation:ss-in .25s ease;max-width:1100px\">\n  <a href=\"#\" sc-camel-on-click=\"{{ goDocsPanel }}\" style=\"font-size:13px;text-decoration:none\">← Электронные документы<\u002Fa>\n  <h1 style=\"font-size:30px;margin:8px 0 16px\">Создать документ<\u002Fh1>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px\">\n    <sc-for list=\"{{ newDocTypes }}\" as=\"t\" hint-placeholder-count=\"8\">\n      <div sc-camel-on-click=\"{{ t.go }}\" style=\"padding:14px 16px;background:{{ t.bg }};color:{{ t.fg }};cursor:pointer;border-radius:var(--radius-sm)\" style-hover=\"background:var(--color-neutral-200)\"><div style=\"font-weight:600;font-size:14px\">{{ t.label }}<\u002Fdiv><div style=\"font-size:12px;opacity:0.7;margin-top:2px\">{{ t.hint }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px\">\n    <div class=\"field\"><label>Контрагент (БИН или название) *<\u002Flabel><input class=\"input\" placeholder=\"Начните вводить — подставим из реестра\" value=\"{{ nd.party }}\" sc-camel-on-change=\"{{ onNd.party }}\"><\u002Fdiv>\n    <div class=\"field\"><label>Проект<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ nd.project }}\" sc-camel-on-change=\"{{ onNd.project }}\"><option>ЖК Sezim Qala<\u002Foption><option>ЖК Nura Esil<\u002Foption><option>4 YOU Comfort<\u002Foption><option>Без проекта<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <div class=\"field\"><label>Регистрационный номер *<\u002Flabel><input class=\"input\" placeholder=\"CMP/Под/SQ-12\" value=\"{{ nd.reg }}\" sc-camel-on-change=\"{{ onNd.reg }}\"><\u002Fdiv>\n    <div class=\"field\"><label>Сумма, ₸<\u002Flabel><input class=\"input\" type=\"number\" value=\"{{ nd.amount }}\" sc-camel-on-change=\"{{ onNd.amount }}\"><\u002Fdiv>\n    <div class=\"field\"><label>Документ-основание<\u002Flabel><input class=\"input\" placeholder=\"Договор, закупка или АВР\" value=\"{{ nd.basis }}\" sc-camel-on-change=\"{{ onNd.basis }}\"><\u002Fdiv>\n    <div class=\"field\"><label>Срок действия / период<\u002Flabel><input class=\"input\" placeholder=\"до 31.12.2027\" value=\"{{ nd.period }}\" sc-camel-on-change=\"{{ onNd.period }}\"><\u002Fdiv>\n    <div style=\"grid-column:span 2;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Маршрут из Матрицы согласования<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ ndRoute }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--color-neutral-100);border-radius:10px;padding:10px 14px;min-width:180px\"><div style=\"font-size:11px;color:var(--color-neutral-600)\">{{ r.role }}<\u002Fdiv><div style=\"font-weight:600;font-size:14px\">{{ r.name }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:8px\">{{ ndRouteHint }} Режим: последовательный. Можно добавить смотрителей.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"grid-column:span 2;display:flex;gap:12px\">\n      <div sc-camel-on-click=\"{{ addNdFile }}\" style=\"flex:1;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:24px;text-align:center;cursor:pointer;font-size:14px\" style-hover=\"color:var(--color-accent)\">+ Прикрепить файл (PDF, DOCX, XLSX)<\u002Fdiv>\n      <div style=\"flex:1;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px;font-size:13px\"><div style=\"color:var(--color-neutral-600);font-size:11px;margin-bottom:6px\">Файлы · {{ ndFileCount }}<\u002Fdiv><sc-for list=\"{{ nd.files }}\" as=\"f\" hint-placeholder-count=\"0\"><div style=\"padding:4px 0\">{{ f }}<\u002Fdiv><\u002Fsc-for><div style=\"color:var(--color-accent-700)\">{{ ndFileErr }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:24px\">\n    <button sc-camel-on-click=\"{{ ndDraft }}\" class=\"btn btn-secondary\">Сохранить черновик<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ ndSend }}\" class=\"btn btn-primary\">Отправить на согласование<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ═══ ЭДО: КАРТОЧКА ДОКУМЕНТА ═══ -->\n<sc-if value=\"{{ isDoc }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"ЭДО · Документ\" style=\"animation:ss-in .25s ease\">\n  <a href=\"#\" sc-camel-on-click=\"{{ goDocsBack }}\" style=\"font-size:13px;text-decoration:none\">← {{ docTypeTitle }}<\u002Fa>\n  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 20px\">\n    <div style=\"min-width:min(100%,560px);flex:1 1 60%\">\n      <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><span style=\"font-weight:800;color:var(--color-accent-700);font-size:16px\">№{{ D.id }}<\u002Fspan><span class=\"tag tag-neutral\">{{ D.type }}<\u002Fspan><span class=\"tag tag-neutral\">{{ D.dir }}<\u002Fspan><span style=\"font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:{{ D.sBg }};color:{{ D.sFg }}\">{{ D.status }}<\u002Fspan><\u002Fdiv>\n      <h1 style=\"font-size:26px;margin:8px 0 0;text-wrap:pretty\">{{ D.reg }}<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <sc-if value=\"{{ D.canApprove }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ approveDoc }}\" class=\"btn btn-primary\">Согласовать<\u002Fbutton><button sc-camel-on-click=\"{{ rejectDoc }}\" class=\"btn btn-secondary\">Отказать<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ D.canSign }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ openSign }}\" class=\"btn btn-primary\">Подписать<\u002Fbutton><button sc-camel-on-click=\"{{ rejectDoc }}\" class=\"btn btn-secondary\">Отказать<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ D.canSend }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ sendDoc }}\" class=\"btn btn-primary\">Отправить на согласование<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ D.canRecall }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ recallDoc }}\" class=\"btn btn-secondary\">Отозвать<\u002Fbutton><\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ docPrint }}\" class=\"btn btn-secondary\">Скачать печатную форму<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px\">\n    <div style=\"grid-column:span 7;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\">Реквизиты<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;font-size:14px;overflow-wrap:anywhere\">\n        <div style=\"min-width:0\"><div style=\"font-size:11px;color:var(--color-neutral-600)\">Контрагент<\u002Fdiv><b>{{ D.party }}<\u002Fb><\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"font-size:11px;color:var(--color-neutral-600)\">Наша сторона<\u002Fdiv><b>ТОО «Company»<\u002Fb><div style=\"font-size:13px\">БИН 120540012345<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Сумма<\u002Fdiv><b style=\"font-size:20px\">{{ D.amountFmt }}<\u002Fb><\u002Fdiv>\n        <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Проект<\u002Fdiv><b>{{ D.project }}<\u002Fb><\u002Fdiv>\n        <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Создан<\u002Fdiv>{{ D.created }} · Арман Жанибеков<\u002Fdiv>\n        <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Основание<\u002Fdiv>{{ D.basis }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"grid-column:span 5;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\">Вложения · {{ D.fileCount }}<\u002Fdiv>\n      <sc-for list=\"{{ D.files }}\" as=\"f\" hint-placeholder-count=\"2\">\n        <div sc-camel-on-click=\"{{ toastDownload }}\" style=\"display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:8px 0;border-top:1px solid var(--color-neutral-200);cursor:pointer\" style-hover=\"color:var(--color-accent)\"><span>{{ f }}<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-600)\">v1 · подписан хэш<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:10px\">Проверка подписи: публичная страница по номеру документа и хэшу.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"grid-column:span 12;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:12px\">Маршрут согласования и подписания<\u002Fdiv>\n ;color:var(--color-neutral-600);margin-bottom:8px\">Комментарии<\u002Fdiv>\n      <sc-for list=\"{{ D.comments }}\" as=\"c\" hint-placeholder-count=\"1\"><div style=\"font-size:13px;padding:7px 0;border-top:1px solid var(--color-neutral-200)\"><b>{{ c.who }}<\u002Fb> <span style=\"color:var(--color-neutral-600)\">{{ c.date }}<\u002Fspan><div>{{ c.txt }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"display:flex;gap:8px;margin-top:auto;padding-top:12px\"><input class=\"input\" placeholder=\"Комментарий участникам маршрута\" value=\"{{ comment }}\" sc-camel-on-change=\"{{ onComment }}\"><button sc-camel-on-click=\"{{ addComment }}\" class=\"btn btn-secondary\">Отправить<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ═══ КАБИНЕТ ═══ -->\n<sc-if value=\"{{ isCabinet }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Кабинет компании\" style=\"animation:ss-in .25s ease\">\n  <h1 style=\"font-size:34px;margin:0 0 16px\">{{ cabTitle }}<\u002Fh1>\n\n  <sc-if value=\"{{ cabCompany }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px\">\n      <div style=\"grid-column:span 4;background:var(--color-graphite);color:#fff;border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"width:56px;height:56px;border-radius:16px;background:#fff;color:var(--color-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:18px\">Co<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;line-height:1.1\">{{ company.name }}<\u002Fdiv>\n        <div style=\"font-size:13px;opacity:0.8\">г. Астана · БИН 120540012345 · плательщик НДС<\u002Fdiv>\n        <div style=\"font-size:13px;margin-top:auto\"><span class=\"tag\" style=\"background:var(--color-success);color:#fff\">Подтверждено ЭЦП<\u002Fspan> <span style=\"margin-left:8px\">рейтинг 4,3 · 27 отзывов<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 8;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Реквизиты<\u002Fdiv><a href=\"#\" sc-camel-on-click=\"{{ openCompanyEdit }}\" style=\"font-size:12px\">Изменить<\u002Fa><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;font-size:14px;margin-top:10px\">\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Руководитель<\u002Fdiv>Абдрахманов Ерлан Серикович<\u002Fdiv>\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">ИИН руководителя<\u002Fdiv>820415•••••••<\u002Fdiv>\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">ОКЭД<\u002Fdiv>41.20 — Строительство зданий<div style=\"font-size:12px;color:var(--color-muted)\">43.22, 43.21, 46.73 — доп.<\u002Fdiv><\u002Fdiv>\n          <div style=\"grid-column:span 2\"><div style=\"font-size:11px;color:var(--color-neutral-600)\">Юридический адрес<\u002Fdiv>{{ company.addr }}<\u002Fdiv>\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Телефон · e-mail<\u002Fdiv>{{ company.phone }} · {{ company.mail }}<\u002Fdiv>\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">Банк<\u002Fdiv>АО «Halyk Bank»<\u002Fdiv>\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">ИИК<\u002Fdiv>KZ86601A••••••••••••<\u002Fdiv>\n          <div><div style=\"font-size:11px;color:var(--color-neutral-600)\">БИК<\u002Fdiv>HSBKKZKX<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 6;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Сферы деятельности · по ним приходят закупки<\u002Fdiv><a href=\"#\" sc-camel-on-click=\"{{ goSpheres }}\" style=\"font-size:12px\">Изменить<\u002Fa><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:10px\">\n          <sc-for list=\"{{ mySphereTags }}\" as=\"sp\" hint-placeholder-count=\"6\"><span class=\"tag tag-accent\">{{ sp }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 6;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Документы компании<\u002Fdiv><a href=\"#\" sc-camel-on-click=\"{{ toastDownload }}\" style=\"font-size:12px\">Скачать архивом<\u002Fa><\u002Fdiv>\n        <div style=\"font-size:14px;margin-top:10px\"><div style=\"padding:6px 0;border-top:1px solid var(--color-neutral-200)\">Свидетельство о регистрации.pdf<\u002Fdiv><div style=\"padding:6px 0;border-top:1px solid var(--color-neutral-200)\">Лицензия на СМР I категории.pdf<\u002Fdiv><div style=\"padding:6px 0;border-top:1px solid var(--color-neutral-200)\">Свидетельство плательщика НДС.pdf<\u002Fdiv><div style=\"padding:6px 0;border-top:1px solid var(--color-neutral-200)\">Приказ о назначении директора.pdf<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ cabSpheres }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px\">\n      <div style=\"grid-column:span 12;background:var(--color-accent-light);border-radius:var(--radius-md);padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n        <div style=\"flex:1 1 320px\"><div style=\"font-weight:700\">Сферы определяют, какие закупки вы увидите и о чём получите уведомление<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:2px\">Сейчас по вашим сферам активны <b>{{ sphActive }}<\u002Fb> закупок на <b>{{ sphSum }}<\u002Fb>. Отмечайте только то, что реально продаёте или выполняете — так в ленте не будет шума.<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goTenders }}\" class=\"btn btn-primary\">Показать закупки по сферам<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ cabSphereTree }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"grid-column:span 4;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-family:var(--font-heading);font-weight:800;font-size:17px\">{{ g.title }}<\u002Fdiv><span style=\"font-size:12px;color:var(--color-muted)\">{{ g.on }} из {{ g.total }}<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ g.items }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <label style=\"display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;padding:8px 0;cursor:pointer;border-top:1px solid var(--color-neutral-200)\"><span style=\"display:flex;gap:10px;align-items:center\"><input type=\"checkbox\" checked=\"{{ c.on }}\" sc-camel-on-change=\"{{ c.toggle }}\" style=\"width:16px;height:16px\">{{ c.label }}<\u002Fspan><span style=\"font-size:11px;color:var(--color-muted);white-space:nowrap\">{{ c.active }}<\u002Fspan><\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"grid-column:span 7;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\">\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted);margin-bottom:10px\">Подписка на закупки · каналы<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px\">\n          <label style=\"display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--color-neutral-100);cursor:pointer;font-size:14px\"><input type=\"checkbox\" checked=\"{{ subs.cab }}\" sc-camel-on-change=\"{{ onSub.cab }}\"> Кабинет и колокольчик<\u002Flabel>\n          <label style=\"display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--color-neutral-100);cursor:pointer;font-size:14px\"><input type=\"checkbox\" checked=\"{{ subs.mail }}\" sc-camel-on-change=\"{{ onSub.mail }}\"> E-mail · {{ company.mail }}<\u002Flabel>\n          <label style=\"display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--color-neutral-100);cursor:pointer;font-size:14px\"><input type=\"checkbox\" checked=\"{{ subs.tg }}\" sc-camel-on-change=\"{{ onSub.tg }}\"> Telegram-бот<\u002Flabel>\n          <label style=\"display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--color-neutral-100);cursor:pointer;font-size:14px\"><input type=\"checkbox\" checked=\"{{ subs.daily }}\" sc-camel-on-change=\"{{ onSub.daily }}\"> Дайджест раз в день вместо мгновенных<\u002Flabel>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tgOff }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:10px\">Telegram не подключён — <a href=\"#\" sc-camel-on-click=\"{{ toastTelegram }}\">подключить бота<\u002Fa>, чтобы узнавать о закупках без проверки почты.<\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted);margin:18px 0 10px\">События<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><span class=\"tag tag-accent\">Новая закупка по сфере<\u002Fspan><span class=\"tag tag-accent\">За 24 ч до конца приёма<\u002Fspan><span class=\"tag tag-accent\">Итоги закупки<\u002Fspan><span class=\"tag tag-accent\">Ответ на вопрос<\u002Fspan><span class=\"tag tag-neutral\">Старт приёма КП<\u002Fspan><span class=\"tag tag-neutral\">Изменение условий<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 5;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted)\">Фильтры подписки<\u002Fdiv>\n        <div class=\"field\"><label>Регионы поставки<\u002Flabel><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ subRegions }}\" as=\"r\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ r.toggle }}\" style=\"font:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;border:1px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }}\">{{ r.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>Минимальная НМЦ закупки, ₸<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ subs.minSum }}\" sc-camel-on-change=\"{{ onSubMin }}\"><option value=\"0\">Любая<\u002Foption><option value=\"1000000\">от 1 млн<\u002Foption><option value=\"10000000\">от 10 млн<\u002Foption><option value=\"50000000\">от 50 млн<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <label style=\"display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ subs.freeOnly }}\" sc-camel-on-change=\"{{ onSub.freeOnly }}\"> Только с бесплатным участием<\u002Flabel>\n        <div style=\"margin-top:auto;font-size:13px;color:var(--color-neutral-700)\">Под эти условия за октябрь подошло nt-size:20px\">{{ p.tenders }}<\u002Fb> закупки<\u002Fspan><span><b style=\"font-size:20px\">{{ p.docs }}<\u002Fb> документов<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ cabMatrix }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"font-size:14px;color:var(--color-neutral-700);max-width:720px\">Правило подбирается по типу документа, сумме и проекту. Маршрут строится автоматически при создании документа; инициатор может добавить смотрителей, но не удалить обязательных согласующих.<\u002Fp>\n    <div style=\"display:flex;justify-content:flex-end;margin-bottom:10px\"><button sc-camel-on-click=\"{{ addRule }}\" class=\"btn btn-primary\">Добавить правило<\u002Fbutton><\u002Fdiv>\n    <sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Тип документа<\u002Fsc-raw-th><sc-raw-th>Сумма от<\u002Fsc-raw-th><sc-raw-th>Сумма до<\u002Fsc-raw-th><sc-raw-th>Согласующие<\u002Fsc-raw-th><sc-raw-th>Подписант<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n      <sc-for list=\"{{ matrix }}\" as=\"m\" hint-placeholder-count=\"5\"><sc-raw-tr><sc-raw-td style=\"font-weight:600\">{{ m.type }}<\u002Fsc-raw-td><sc-raw-td>{{ m.fromFmt }}<\u002Fsc-raw-td><sc-raw-td>{{ m.toFmt }}<\u002Fsc-raw-td><sc-raw-td>{{ m.approvers }}<\u002Fsc-raw-td><sc-raw-td>{{ m.signer }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for>\n    <\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ cabTariffs }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\">\n      <div style=\"background:var(--color-graphite);color:#fff;border-radius:var(--radius-md);padding:20px\"><div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.7\">ЭДО · активен<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:28px;margin-top:6px\">Business<\u002Fdiv><div style=\"font-size:13px;opacity:0.85\">200 000 ₸ / год · 3 000 документов · до 19.10.2027<\u002Fdiv><div style=\"height:6px;border-radius:99px;background:rgba(255,255,255,.2);margin:14px 0 4px\"><div style=\"height:6px;border-radius:99px;width:71%;background:#fff\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px\">142 из 200 документов в октябре<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:var(--color-graphite);color:#fff;border-radius:var(--radius-md);padding:20px\"><div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.7\">Закупки · поставщик · активен<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:800;font-size:28px;margin-top:6px\">Light<\u002Fdiv><div style=\"font-size:13px;opacity:0.85\">40 000 ₸ / 30 дней · до 25.11.2026 · комиссия победителя 0,2 %<\u002Fdiv><button sc-camel-on-click=\"{{ toastUpgrade }}\" class=\"btn\" style=\"margin-top:14px;background:#fff;color:var(--color-graphite);width:100%;white-space:normal;text-align:left;justify-content:flex-start\">Перейти на Prime<\u002Fbutton><\u002Fdiv>\n      <div style=\"background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:20px\"><div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Промокод<\u002Fdiv><div style=\"display:flex;gap:8px;margin-top:10px\"><input class=\"input\" placeholder=\"SOYUZ2026\"><button sc-camel-on-click=\"{{ toastPromo }}\" class=\"btn btn-primary\">Применить<\u002Fbutton><\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:10px\">Публикация закупок и подписание документов — бесплатно для всех участников Союза.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:32px 0 12px\">\n      <h2 style=\"font-size:22px;margin:0\">Все тарифы<\u002Fh2>\n      <div style=\"display:inline-flex;border:1px solid var(--color-divider);border-radius:999px;overflow:hidden;background:var(--color-surface)\">\n        <button sc-camel-on-click=\"{{ tarLineBuy }}\" style=\"padding:8px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:0;background:{{ tarBuyBg }};color:{{ tarBuyFg }}\">Закупки<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ tarLineEdo }}\" style=\"padding:8px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:0;background:{{ tarEdoBg }};color:{{ tarEdoFg }}\">Документооборот<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n      <sc-for list=\"{{ tariffPlans }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"position:relative;background:{{ p.bg }};color:{{ p.fg }};border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px;display:flex;flex-direction:column;gap:10px;border:1px solid {{ p.border }}\">\n          <sc-if value=\"{{ p.badge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;background:{{ p.badgeBg }};color:{{ p.badgeFg }}\">{{ p.badge }}<\u002Fspan><\u002Fsc-if>\n          <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">{{ p.name }}<\u002Fdiv>\n          <div><span style=\"font-family:var(--font-heading);font-weight:800;font-size:28px;letter-spacing:-0.02em\">{{ p.price }}<\u002Fspan> <span style=\"font-size:13px;opacity:.7\">{{ p.period }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;opacity:.85;min-height:20px\">{{ p.note }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ p.pick }}\" class=\"btn\" style=\"margin-top:4px;background:{{ p.btnBg }};color:{{ p.btnFg }};justify-content:center\">{{ p.cta }}<\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid {{
