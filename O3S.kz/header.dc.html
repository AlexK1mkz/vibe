<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    @media(max-width:1100px){[data-desk]{display:none!important}}
    @media(min-width:1101px){[data-mob]{display:none!important}}
  </style>
</helmet>
<header style="position:sticky;top:0;z-index:50;background:rgba(246,249,250,.88);backdrop-filter:blur(14px);border-bottom:1px solid #E1E8EB;font-family:Inter,system-ui,sans-serif">
  <div style="max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px);height:72px;display:flex;align-items:center;gap:24px">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:10px;color:#0B1F2A;text-decoration:none">
      <span style="display:flex;gap:3px"><i style="width:8px;height:8px;border-radius:50%;background:#12B5C9"></i><i style="width:8px;height:8px;border-radius:50%;background:#12B5C9;opacity:.7"></i><i style="width:8px;height:8px;border-radius:50%;background:#12B5C9;opacity:.4"></i></span>
      <span style="font-family:Onest,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em">O<sub style="font-size:14px;vertical-align:-4px">3</sub>S</span>
    </a>
    <nav data-desk style="display:flex;gap:28px;margin-left:16px">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="color:{{ n.color }};font-weight:500;font-size:15px;text-decoration:none;border-bottom:2px solid {{ n.line }};padding:4px 0" style-hover="color:#12B5C9">{{ n.label }}</a>
      </sc-for>
    </nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <div style="display:flex;border:1px solid #D5DEE2;border-radius:999px;padding:3px;font-size:12px;font-weight:600">
        <button onClick="{{ setRu }}" style="border:0;border-radius:999px;padding:4px 10px;cursor:pointer;background:{{ ruBg }};color:{{ ruFg }}">RU</button>
        <button onClick="{{ setKz }}" style="border:0;border-radius:999px;padding:4px 10px;cursor:pointer;background:{{ kzBg }};color:{{ kzFg }}">KZ</button>
      </div>
      <a data-desk href="tel:+77710010744" style="color:#0B1F2A;font-weight:600;font-size:15px;font-family:'JetBrains Mono',monospace;text-decoration:none;white-space:nowrap">+7 771 001 07 44</a>
      <a data-desk href="https://wa.me/77710010744?text=Здравствуйте!%20Интересует%20стерилизатор%20O3S" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none" style-hover="background:#1EBE5A">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>WhatsApp</a>
      <button data-mob onClick="{{ toggleMenu }}" aria-label="Меню" style="border:0;background:none;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:5px"><i style="width:22px;height:2px;background:#0B1F2A"></i><i style="width:22px;height:2px;background:#0B1F2A"></i><i style="width:14px;height:2px;background:#0B1F2A"></i></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav data-mob style="display:flex;flex-direction:column;border-top:1px solid #E1E8EB;background:#fff;padding:8px 16px 16px">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="color:{{ n.color }};font-weight:600;font-size:17px;padding:12px 0;border-bottom:1px solid #EEF2F4;text-decoration:none">{{ n.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Каталог&quot;,&quot;Аренда&quot;,&quot;Стоматологиям&quot;,&quot;Контакты&quot;,&quot;&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { lang: 'RU', menuOpen: false };
  renderVals() {
    const NAV = [
      ['Каталог', 'catalog.dc.html'], ['Аренда', 'rent.dc.html'], ['Стоматологиям', 'dental.dc.html'],
      ['Технология', 'index.dc.html#tech'], ['О компании', 'index.dc.html#about'], ['Контакты', 'contacts.dc.html'],
    ];
    const active = this.props.active ?? '';
    const ru = this.state.lang === 'RU';
    return {
      items: NAV.map(([label, href]) => ({ label, href, color: label === active ? '#0A7F8E' : '#0B1F2A', line: label === active ? '#12B5C9' : 'transparent' })),
      menuOpen: this.state.menuOpen,
      ruBg: ru ? '#0B1F2A' : 'transparent', ruFg: ru ? '#fff' : '#0B1F2A', kzBg: ru ? 'transparent' : '#0B1F2A', kzFg: ru ? '#0B1F2A' : '#fff',
      setRu: () => this.setState({ lang: 'RU' }), setKz: () => this.setState({ lang: 'KZ' }),
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
    };
  }
}
</script>
</body>
</html>
